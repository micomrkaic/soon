# soon CI: build the program and run the unit tests on Linux and macOS,
# plus the UI checks on Linux.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make -j4
      - name: unit tests
        run: make test
      - name: UI checks (sanitizer build)
        run: sudo apt-get update && sudo apt-get install -y python3-pyte && make check-ui

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make -j4
      - name: unit tests
        run: make test
